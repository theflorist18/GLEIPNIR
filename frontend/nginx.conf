# GLEIPNIR frontend — serves the built SPA and proxies the gateway API.
# The SPA talks ONLY to the gateway; nginx forwards /api/* to the gateway
# service (:3000) WITHOUT rewriting the path, so the gateway still sees its
# public prefix /api/v1/... (proxy_pass has no trailing URI -> path preserved).
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;

    # Security headers (S12). `always` so they apply to error responses too.
    #   - frame-ancestors 'none' + X-Frame-Options: the app can never be framed,
    #     defeating clickjacking onto destructive controls (transfer/flag).
    #   - nosniff: the browser must honour our Content-Type, not guess.
    #   - CSP calibrated to what the SPA actually needs: the Vite build emits
    #     only EXTERNAL scripts (no inline), so script-src 'self' holds; Recharts
    #     injects inline styles at runtime, hence style-src 'unsafe-inline'
    #     (styles, not scripts — low risk); blob: is required for the evidence
    #     preview iframe/img/video/audio and download object URLs; connect-src
    #     'self' since the SPA talks only to the same-origin /api proxy.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; connect-src 'self'" always;

    # gzip for the static bundle
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health endpoint (CONTRACTS §6: every service exposes GET /healthz).
    # Without this the SPA fallback served index.html as a false-positive 200.
    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        # the gateway's `trust proxy` + req.ip (login throttle, security log)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA fallback: any non-file route serves index.html (client-side scope switch).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must revalidate: it names the hashed bundles, and without a
    # Cache-Control browsers cache it heuristically and keep serving the old
    # build after a redeploy. `expires` (not add_header) keeps the server-level
    # security headers inherited.
    location = /index.html {
        expires -1;
    }
}
