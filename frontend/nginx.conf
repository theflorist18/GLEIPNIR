# GLEIPNIR frontend — serves the built SPA and proxies the gateway API.
# The SPA talks ONLY to the gateway; nginx forwards /api/* to the gateway
# service (:3000) WITHOUT rewriting the path, so the gateway still sees its
# public prefix /api/v1/... (proxy_pass has no trailing URI -> path preserved).
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the static bundle
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: any non-file route serves index.html (client-side scope switch).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
