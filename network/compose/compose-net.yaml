# GLEIPNIR core network — 3 orderers (etcdraft), 2 peers (+ anchor peer),
# the ccaas chaincode servers, and a tools/cli container.
# Ports, hostnames and named volumes per docs/CONTRACTS.md §1, §8.
# Images are PINNED (never :latest — that resolves to Fabric 3.x, docs/research §1).
#
# Peers/orderers have no container healthcheck (the base images lack a shell HTTP
# client); orchestration/up.sh waits by polling the published operations /healthz
# ports from the host.

networks:
  gleipnir-net:
    name: gleipnir-net

volumes:
  orderer0-ledger:
  orderer1-ledger:
  orderer2-ledger:
  peer0org1-ledger:
  peer0org2-ledger:
  peer0anchor-ledger:

# Settings shared by the three orderers / three peers (merged in with `<<:`; only
# the per-node addresses, ports and crypto mounts stay under each service).
# Bracketed values are quoted: unquoted they parse as YAML lists.
x-orderer: &orderer
  image: hyperledger/fabric-orderer:${FABRIC_TAG}
  working_dir: /root
  command: orderer
  networks: [gleipnir-net]

x-orderer-env: &orderer-env
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
  ORDERER_GENERAL_LOCALMSPID: OrdererMSP
  ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
  ORDERER_GENERAL_TLS_ENABLED: "true"
  ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
  ORDERER_ADMIN_TLS_ENABLED: "true"
  ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"

x-peer: &peer
  image: hyperledger/fabric-peer:${FABRIC_TAG}
  working_dir: /root
  command: peer node start
  depends_on: [orderer0, orderer1, orderer2]
  networks: [gleipnir-net]

x-peer-env: &peer-env
  FABRIC_CFG_PATH: /etc/hyperledger/peercfg
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_LEDGER_STATE_STATEDATABASE: goleveldb
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s

services:
  # ---------------------------------------------------------------- orderers
  orderer0:
    <<: *orderer
    container_name: orderer0.example.com
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    volumes:
      - ../orderer.yaml:/etc/hyperledger/fabric/orderer.yaml
      - ../organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/tls:/var/hyperledger/orderer/tls
      - orderer0-ledger:/var/hyperledger/production/orderer

  orderer1:
    <<: *orderer
    container_name: orderer1.example.com
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 8050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    ports:
      - "8050:8050"
      - "8053:8053"
      - "9444:9444"
    volumes:
      - ../orderer.yaml:/etc/hyperledger/fabric/orderer.yaml
      - ../organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/tls:/var/hyperledger/orderer/tls
      - orderer1-ledger:/var/hyperledger/production/orderer

  orderer2:
    <<: *orderer
    container_name: orderer2.example.com
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 9050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
    ports:
      - "9050:9050"
      - "9053:9053"
      - "9445:9445"
    volumes:
      - ../orderer.yaml:/etc/hyperledger/fabric/orderer.yaml
      - ../organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/tls:/var/hyperledger/orderer/tls
      - orderer2-ledger:/var/hyperledger/production/orderer

  # ------------------------------------------------------------------- peers
  peer0-org1:
    <<: *peer
    container_name: peer0.org1.example.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
    ports:
      - "7051:7051"
      - "9446:9446"
    volumes:
      - ../core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0org1-ledger:/var/hyperledger/production

  peer0-org2:
    <<: *peer
    container_name: peer0.org2.example.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org2.example.com
      CORE_PEER_ADDRESS: peer0.org2.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.example.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.example.com:9051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9447
    ports:
      - "9051:9051"
      - "9447:9447"
    volumes:
      - ../core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0org2-ledger:/var/hyperledger/production

  # Anchor-org peer — only for Parallel-Anchored (endorses anchor-main roots).
  peer0-anchor:
    <<: *peer
    container_name: peer0.anchor.example.com
    profiles: ["parallel-anchored"]
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.anchor.example.com
      CORE_PEER_ADDRESS: peer0.anchor.example.com:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.anchor.example.com:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.anchor.example.com:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.anchor.example.com:11051
      CORE_PEER_LOCALMSPID: AnchorClientMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9448
    ports:
      - "11051:11051"
      - "9448:9448"
    volumes:
      - ../core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../organizations/peerOrganizations/anchor.example.com/peers/peer0.anchor.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/anchor.example.com/peers/peer0.anchor.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0anchor-ledger:/var/hyperledger/production

  # ------------------------------------------------------- ccaas chaincode servers
  # One evidence chaincode server for the org1+org2 peers (both install the same
  # package, so both dial this address with the same package id CCAAS_ID_APP).
  ccaas-evidence:
    container_name: ccaas-evidence
    build:
      context: ../../chaincode/evidence
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CCAAS_ID_APP:-unset}
    networks: [gleipnir-net]

  # Separate server for anchor-main (different install package -> different id).
  ccaas-evidence-anchor:
    container_name: ccaas-evidence-anchor
    profiles: ["parallel-anchored"]
    build:
      context: ../../chaincode/evidence
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CCAAS_ID_ANCHOR:-unset}
    networks: [gleipnir-net]

  # ------------------------------------------------------------------- tools/cli
  cli:
    container_name: gleipnir-cli
    image: hyperledger/fabric-tools:${TOOLS_TAG}
    environment:
      - FABRIC_CFG_PATH=/opt/gleipnir/network
    working_dir: /opt/gleipnir
    command: sleep infinity
    volumes:
      - ../../:/opt/gleipnir
    depends_on: [orderer0, peer0-org1, peer0-org2]
    networks: [gleipnir-net]
