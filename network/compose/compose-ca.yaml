# GLEIPNIR Fabric CA 1.5.19 servers — one per org (docs/CONTRACTS.md §1, §12).
# ca-org1 7054, ca-org2 8054, ca-anchor 9054 (parallel-anchored profile), ca-orderer 10054.
# Brought up first; network/crypto/registerEnroll.sh enrolls against them.

networks:
  gleipnir-net:
    name: gleipnir-net

services:
  ca-org1:
    image: hyperledger/fabric-ca:${CA_TAG}
    container_name: ca-org1
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/ca-org1:/etc/hyperledger/fabric-ca-server
    networks:
      - gleipnir-net

  ca-org2:
    image: hyperledger/fabric-ca:${CA_TAG}
    container_name: ca-org2
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/ca-org2:/etc/hyperledger/fabric-ca-server
    networks:
      - gleipnir-net

  ca-orderer:
    image: hyperledger/fabric-ca:${CA_TAG}
    container_name: ca-orderer
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=10054
    ports:
      - "10054:10054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/ca-orderer:/etc/hyperledger/fabric-ca-server
    networks:
      - gleipnir-net

  # Anchor org CA — only started for the Parallel-Anchored variant.
  ca-anchor:
    image: hyperledger/fabric-ca:${CA_TAG}
    container_name: ca-anchor
    profiles: ["parallel-anchored"]
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-anchor
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
    ports:
      - "9054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/ca-anchor:/etc/hyperledger/fabric-ca-server
    networks:
      - gleipnir-net
