# Caliper 0.6.0 network config — peer-gateway (fabric) connector, coc-main channel.
# Used by the Standard and Anchoring fabric-mode rounds. Bind with:
#   npx caliper bind --caliper-bind-sut fabric:fabric-gateway
# (docs/research/caliper-0.6.0.md Q1). `contracts` (NOT contractIds) is the 0.6.0 key.
name: GLEIPNIR coc-main
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  - channelName: coc-main
    contracts:
      - id: evidence

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: User1
          clientPrivateKey:
            path: ../network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/priv_sk
          clientSignedCert:
            path: ../network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/cert.pem
    connectionProfile:
      path: networks/connection-org1.yaml
      discover: false
