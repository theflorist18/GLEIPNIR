# STEADY-STATE — Parallel variant. One Caliper run per case channel, each with its
# own network config (networks/<caseId>.yaml, generated from case-template.yaml by
# orchestration/provision-channel.sh). sweep.py drives the channel sweep {1,2,5},
# runs this round set per channel, and reports throughput per-channel AND aggregate.
# The channel is selected by the network config; the workload stays variant-agnostic.
test:
  name: gleipnir-steady-parallel
  description: Parallel variant steady-state — per-case channel, fabric write path.
  workers:
    number: 4
  rounds:
    - label: create-50tps
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/createEvidence.js
        arguments:
          mode: fabric
    - label: access-spread-50tps
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/accessLog.js
        arguments:
          mode: fabric
          scenario: spread
          pool: 25
